<!-- CommonHeader.html -->
<!-- Report Title Section -->
<tr>
    <td colspan="8" class="report-title">Member Detail Report</td>
</tr>
<tr>
    <td colspan="8" class="report-info">Generated on: {{GeneratedDateString}}</td>
</tr>
<tr>
    <td colspan="8" class="report-info">Generated by: {{GeneratedBy}}</td>
</tr>
<tr>
    <td colspan="8" style="height: 10px;">&nbsp;</td>
</tr>

<!-- Organization Info Section -->
{{#if HeaderReport.CommonHeader}}
{{#each HeaderReport.CommonHeader}}
<tr>
    <td class="org-label">Organization:</td>
    <td colspan="3" class="org-info">{{CompanyName}}</td>
    <td class="org-label">Address:</td>
    <td colspan="3" class="org-info">{{CompanyAddress}}</td>
</tr>
<tr>
    <td class="org-label">Phone:</td>
    <td colspan="3" class="org-info">{{PhoneNo}}</td>
    <td class="org-label">Email:</td>
    <td colspan="3" class="org-info">{{CompanyEmailId}}</td>
</tr>
{{/each}}
{{/if}}

<tr>
    <td colspan="8" style="height: 15px;">&nbsp;</td>
</tr>
